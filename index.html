<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/logo.png" type="image/png">
    <title>Tx Ledger</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header id="bar">
      <nav>
        <a href="#/">
          <img src="/logo.png" alt="">
          <b data-t="title"></b>
        </a>
        <span>
          <a class="btn" href="#/" data-t="records"></a>
          <a class="btn" href="#/entities" data-t="entities"></a>
        </span>
      </nav>
      <menu>
        <a class="btn" href="#/new" data-t="new" data-tone="credit"></a>
        <button type="button" commandfor="settings" command="show-modal" data-label="settings">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="m21.51 14.59l-1.25-1.32a7.9 7.9 0 0 0-.06-2.9l1.22-1.32a.76.76 0 0 0 .14-.79a10.3 10.3 0 0 0-2.2-3.35a.74.74 0 0 0-.72-.19l-1.84.47a8.5 8.5 0 0 0-1.83-1l-.45-1.72a.73.73 0 0 0-.59-.55a10 10 0 0 0-1.89-.17a9.4 9.4 0 0 0-2.35.31a.73.73 0 0 0-.53.53l-.48 1.77a8.2 8.2 0 0 0-1.52.88l-1.82-.45a.73.73 0 0 0-.72.21a10 10 0 0 0-2.23 3.62a.76.76 0 0 0 .16.77l1.26 1.31q-.096.631-.1 1.27c0 .3 0 .6.05.9l-1.31 1.46a.75.75 0 0 0-.16.73a10 10 0 0 0 2 3.59a.75.75 0 0 0 .76.24l1.72-.44a8 8 0 0 0 2 1.23l.5 1.79a.77.77 0 0 0 .56.53c.721.163 1.459.247 2.2.25q.886-.01 1.76-.17a.75.75 0 0 0 .59-.53l.47-1.69a8.1 8.1 0 0 0 2.38-1.34l1.76.4a.74.74 0 0 0 .73-.24a10.1 10.1 0 0 0 2-3.34a.76.76 0 0 0-.21-.75m-9.39 1.27a3.81 3.81 0 1 1-.021-7.619a3.81 3.81 0 0 1 .02 7.62"/></svg>
        </button>
        <button type="button" data-act="theme">
        <svg class="sun" viewBox="0 0 24 24"><path fill="currentColor" d="M17.891 12a5.94 5.94 0 0 1-3.68 5.499a5.97 5.97 0 0 1-6.496-1.295A5.948 5.948 0 0 1 11.943 6.05a5.96 5.96 0 0 1 4.21 1.743A5.94 5.94 0 0 1 17.89 12M3.203 13.048H2.05A1.05 1.05 0 0 1 1 12a1.047 1.047 0 0 1 1.05-1.048h1.153A1.05 1.05 0 0 1 4.253 12a1.047 1.047 0 0 1-1.05 1.048m18.747 0h-1.143A1.05 1.05 0 0 1 19.758 12a1.047 1.047 0 0 1 1.05-1.048h1.143A1.05 1.05 0 0 1 23 12a1.047 1.047 0 0 1-1.05 1.048m-9.965-8.8a1.05 1.05 0 0 1-1.05-1.048V2.048A1.047 1.047 0 0 1 11.986 1a1.05 1.05 0 0 1 1.049 1.048V3.2a1.047 1.047 0 0 1-1.05 1.048m0 18.752a1.05 1.05 0 0 1-1.05-1.047V20.8a1.047 1.047 0 0 1 1.05-1.048a1.05 1.05 0 0 1 1.049 1.048v1.152A1.047 1.047 0 0 1 11.984 23M5.753 6.825a1.05 1.05 0 0 1-.745-.314l-.819-.807a1.051 1.051 0 0 1 .745-1.796c.28 0 .548.111.745.308l.819.817a1.047 1.047 0 0 1 0 1.478a1.05 1.05 0 0 1-.745.314m13.271 13.221a1.05 1.05 0 0 1-.735-.304l-.818-.817a1.047 1.047 0 0 1 1.14-1.739q.196.096.34.262l.818.817a1.047 1.047 0 0 1 0 1.477a1.05 1.05 0 0 1-.745.304m-.808-13.221a1.05 1.05 0 0 1-1.034-1.254c.04-.204.142-.391.29-.538l.818-.817a1.05 1.05 0 0 1 1.48 1.488l-.82.807a1.05 1.05 0 0 1-.734.314M4.934 20.046a1.05 1.05 0 0 1-.745-.304a1.046 1.046 0 0 1 0-1.477l.819-.817a1.05 1.05 0 0 1 1.49 0a1.047 1.047 0 0 1 0 1.477l-.819.817a1.05 1.05 0 0 1-.745.304"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.88 15.147a10.23 10.23 0 0 1-19.63-5.64a10.28 10.28 0 0 1 6.63-7.37a1.77 1.77 0 0 1 1-.07a1.8 1.8 0 0 1 .89.45a1.81 1.81 0 0 1 .48 1.84a7 7 0 0 0-.08 4.21a6.27 6.27 0 0 0 4.3 4.31a6.9 6.9 0 0 0 4.2-.08a1.83 1.83 0 0 1 1 0a1.8 1.8 0 0 1 1.3 1.39a1.8 1.8 0 0 1-.09.96"/></svg>
        </button>
      </menu>
    </header>
    <dialog id="settings" closedby="any">
      <button type="button" commandfor="settings" command="close" data-label="close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <form id="io">
        <h2 data-t="settings"></h2>
        <h3 data-t="appearance"></h3>
        <p data-t="language"></p>
        <button type="button" data-act="lang" data-t="lang"></button>
        <p data-t="palette"></p>
        <div class="swatches">
          <button type="button" data-act="palette" data-palette="ink" data-label="ink"></button>
          <button type="button" data-act="palette" data-palette="slate" data-label="slate"></button>
          <button type="button" data-act="palette" data-palette="sand" data-label="sand"></button>
          <button type="button" data-act="palette" data-palette="blue" data-label="blue"></button>
          <button type="button" data-act="palette" data-palette="sea" data-label="sea"></button>
          <button type="button" data-act="palette" data-palette="green" data-label="green"></button>
          <button type="button" data-act="palette" data-palette="plum" data-label="plum"></button>
          <button type="button" data-act="palette" data-palette="rose" data-label="rose"></button>
        </div>
        <h3 data-t="data"></h3>
        <p data-t="backupHint"></p>
        <button type="button" data-act="backup" data-t="backup" data-tone="out"></button>
        <p data-t="mergeHint"></p>
        <label class="btn" data-tone="credit"><span data-t="merge"></span><input type="file" name="merge" accept=".sqlite,.sqlite3,.db" hidden></label>
        <p data-t="replaceHint"></p>
        <label class="btn" data-tone="restore"><span data-t="replace"></span><input type="file" name="replace" accept=".sqlite,.sqlite3,.db" hidden></label>
        <p data-t="wipeHint"></p>
        <button type="button" data-act="wipe" data-t="wipe" data-tone="del"></button>
      </form>
    </dialog>
    <dialog id="screen" closedby="any"></dialog>
    <dialog id="ask" closedby="any" aria-labelledby="ask-title">
      <h2 id="ask-title"></h2>
      <p id="ask-body"></p>
      <form method="dialog">
        <button value="no" data-tone="cancel" autofocus data-t="cancel"></button>
        <button value="ok" data-tone="del"></button>
      </form>
    </dialog>
    <main>
      <aside id="history">
        <form id="filters">
          <input type="search" name="q" data-hint="search">
          <div class="days">
            <a href="#/span" id="span"><span data-t="last"></span></a>
            <input type="number" name="days" min="1" value="7">
            <span data-t="days"></span>
          </div>
          <label><span data-t="from"></span><input type="date" name="from"></label>
          <label><span data-t="to"></span><input type="date" name="to"></label>
          <fieldset class="switch">
            <label><input type="radio" name="mode" value="date" checked><span data-t="byDate"></span></label>
            <label><input type="radio" name="mode" value="desc"><span data-t="byDesc"></span></label>
          </fieldset>
          <fieldset class="switch">
            <label><input type="radio" name="side" value="" checked><span data-t="all"></span></label>
            <label><input type="radio" name="side" value="sale"><span data-t="sale"></span></label>
            <label><input type="radio" name="side" value="buy"><span data-t="buy"></span></label>
          </fieldset>
        </form>
        <nav id="list"></nav>
      </aside>
      <div id="split" role="separator" aria-orientation="vertical" tabindex="0" data-label="resize"></div>
      <section id="record"></section>
    </main>
    <div id="sheet"></div>
    <p id="toast" role="status" hidden></p>
  </body>
</html>
